<link rel="stylesheet" href="{{ url_for('static', filename='personality_radar.css') }}?v=86216718cede">

<section class="psych-radar-workspace">

    <h3 class="psych-radar-heading">
        Psychological Architecture
    </h3>

    <p class="psych-radar-subtitle">
        Explore the dimensions of your personality.
        Select a psychological category to examine
        its individual characteristics.
    </p>

    <div id="psychRadarButtons"
         class="psych-radar-buttons">
    </div>

    <div class="psych-radar-layout">

        <div>
            <svg id="psychRadar"
                 class="psych-radar-svg"
                 viewBox="0 0 520 460"
                 role="img"
                 aria-label="Interactive psychological radar">
            </svg>

            <p id="psychRadarNote"
               class="psych-radar-note">
            </p>
        </div>

        <div>

            <div id="psychRadarSelection"
                 class="psych-radar-selection">
            </div>

            <p id="psychRadarDescription"
               class="psych-radar-subtitle">
            </p>

            <div id="psychRadarDetails"></div>

        </div>

    </div>

</section>

<script id="psychRadarData" type="application/json">
{{ personality.groups | tojson }}
</script>

<script src="{{ url_for('static', filename='personality_radar.js') }}?v=1"
        defer></script>

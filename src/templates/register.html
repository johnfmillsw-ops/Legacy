
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Legacy | Register</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            color: #e2e8f0;
            font-family: Arial, sans-serif;
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            margin: 20px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            box-sizing: border-box;
        }

        h1 {
            margin: 0;
            font-size: 36px;
            letter-spacing: 3px;
            color: white;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #475569;
            border-radius: 6px;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        a {
            color: #60a5fa;
            text-decoration: none;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
        }

        .message {
            padding: 12px;
            margin-bottom: 20px;
            background: #334155;
            border-radius: 6px;
            font-size: 14px;
        }

        .help-text {
            color: #94a3b8;
            font-size: 12px;
            margin-top: -12px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <main class="auth-card">

        <h1>LEGACY</h1>

        <p class="subtitle">
            Create your personal knowledge workspace.
        </p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="message" role="status">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST"
              action="{{ url_for('auth.register') }}">

            <input type="hidden"
                   name="_csrf_token"
                   value="{{ csrf_token() }}">

            <label for="email">Email address</label>

            <input type="email"
                   id="email"
                   name="email"
                   autocomplete="username"
                   maxlength="254"
                   required>

            <label for="password">Password</label>

            <input type="password"
                   id="password"
                   name="password"
                   minlength="12"
                   maxlength="128"
                   autocomplete="new-password"
                   required>

            <p class="help-text">
                Use at least 12 characters.
            </p>

            <label for="confirm_password">
                Confirm password
            </label>

            <input type="password"
                   id="confirm_password"
                   name="confirm_password"
                   minlength="12"
                   maxlength="128"
                   autocomplete="new-password"
                   required>

            <button type="submit">
                Create account
            </button>

        </form>

        <div class="footer">
            Already have an account?
            <a href="{{ url_for('auth.login') }}">
                Sign in
            </a>
        </div>

    </main>

</body>
</html>

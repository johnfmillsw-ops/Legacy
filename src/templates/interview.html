<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Legacy - Interview</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #fdfdfd;
        color: #1f2937;
        line-height: 1.55;
        margin: 0;
        padding: 0;
      }
      .container {
        max-width: 760px;
        margin: 40px auto;
        padding: 0 16px;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        border-bottom: 1px solid #e5e7eb;
        padding-bottom: 16px;
        margin-bottom: 24px;
      }
      .header h1 {
        font-size: 24px;
        font-weight: 700;
        margin: 0;
      }
      .header a {
        color: #4b5563;
        text-decoration: none;
        font-weight: 500;
      }
      .header a:hover {
        color: #1f2937;
        text-decoration: underline;
      }
      .card {
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      }
      h3 {
        font-size: 20px;
        margin: 0 0 20px;
      }
      .progress {
        color: #6b7280;
        font-size: 15px;
        margin-bottom: 8px;
      }
      textarea {
        width: 100%;
        min-height: 160px;
        padding: 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 16px;
        resize: vertical;
        box-sizing: border-box;
      }
      input[type="text"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 15px;
        margin-top: 12px;
      }
      .actions {
        display: flex;
        gap: 16px;
        margin-top: 20px;
      }
      button {
        padding: 10px 20px;
        background: #1f2937;
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.15s;
      }
      button:hover {
        background: #111827;
      }
      a.skip {
        padding: 10px 20px;
        background: #f1f5f9;
        color: #334155;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        text-decoration: none;
        transition: background 0.15s;
      }
      a.skip:hover {
        background: #e2e8f0;
      }
      @media (max-width: 600px) {
        .actions { flex-direction: column; gap: 12px; }
      }
    </style>
  </head>
  <body>

    <div class="container">

      <div class="header">
        <div>
          <h1>Legacy</h1>
          <div style="color:#6b7280;">Subject: <b>{{ subject }}</b></div>
        </div>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
      </div>

      <div class="card">
        <div class="progress">Category: {{ category }} ({{ idx + 1 }} of {{ total }})</div>
        <h3>{{ prompt_text }}</h3>

        <form method="post">
<input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
          <textarea name="answer" placeholder="Your answer here..." required></textarea>

          <input type="text" name="tags" placeholder="Optional tags (comma-separated)" />

          <div class="actions">
            <button type="submit">Save & Next</button>
            <a href="{{ url_for('interview_skip', category=category, i=idx) }}" class="skip">Skip</a>
          </div>
        </form>
      </div>

    </div>

  </body>
</html>

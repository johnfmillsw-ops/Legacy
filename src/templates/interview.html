
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Legacy - Interview</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        line-height: 1.55;
        margin: 0;
        padding: 0;
      }
      .container {
        max-width: 760px;
        margin: 40px auto;
        padding: 0 16px;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        border-bottom: 1px solid #334155;
        padding-bottom: 16px;
        margin-bottom: 24px;
      }
      .header h1 {
        font-size: 24px;
        font-weight: 700;
        margin: 0;
        color: white;
      }
      .header a {
        color: #60a5fa;
        text-decoration: none;
        font-weight: 500;
      }
      .header a:hover {
        color: #93c5fd;
        text-decoration: underline;
      }
      .card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 24px;
        box-shadow: none;
      }
      h3 {
        font-size: 20px;
        margin: 0 0 20px;
        color: white;
      }
      .progress {
        color: #94a3b8;
        font-size: 15px;
        margin-bottom: 8px;
      }
      textarea {
        width: 100%;
        min-height: 160px;
        padding: 12px;
        border: 1px solid #475569;
        border-radius: 8px;
        background: #0f172a;
        color: #ffffff;
        font-family: inherit;
        font-size: 16px;
        resize: vertical;
        box-sizing: border-box;
      }
      input[type="text"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #475569;
        border-radius: 8px;
        background: #0f172a;
        color: #ffffff;
        font-family: inherit;
        font-size: 15px;
        margin-top: 12px;
        box-sizing: border-box;
      }
      textarea::placeholder,
      input[type="text"]::placeholder {
        color: #94a3b8;
      }
      textarea:focus-visible,
      input[type="text"]:focus-visible,
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid #93c5fd;
        outline-offset: 2px;
      }
      .actions {
        display: flex;
        gap: 16px;
        margin-top: 20px;
      }
      button {
        padding: 10px 20px;
        background: #2563eb;
        color: white;
        border: 1px solid #2563eb;
        border-radius: 8px;
        font-family: inherit;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.15s;
      }
      button:hover {
        background: #1d4ed8;
      }
      a.skip {
        padding: 10px 20px;
        background: #334155;
        color: #e2e8f0;
        border: 1px solid #475569;
        border-radius: 8px;
        text-decoration: none;
        transition: background 0.15s;
      }
      a.skip:hover {
        background: #475569;
        color: white;
      }
      @media (max-width: 600px) {
        .header {
          flex-direction: column;
          align-items: flex-start;
        }
        .actions {
          flex-direction: column;
          gap: 12px;
        }
        .actions button,
        .actions a {
          text-align: center;
        }
      }
    </style>
  </head>
  <body>

    <div class="container">

      <div class="header">
        <div>
          <h1>Legacy</h1>
          <div style="color:#94a3b8;">Subject: <b>{{ subject }}</b></div>
        </div>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
      </div>

      <div class="card">
        <div class="progress">Category: {{ category }} ({{ idx + 1 }} of {{ total }})</div>
        <h3>{{ prompt_text }}</h3>

        <form method="post">
<input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
          <textarea name="answer" placeholder="Your answer here..." required></textarea>

          <input type="text" name="tags" placeholder="Optional tags (comma-separated)" />

          <div class="actions">
            <button type="submit">Save & Next</button>
            <a href="{{ url_for('interview_skip', category=category, i=idx) }}" class="skip">Skip</a>
          </div>
        </form>
      </div>

    </div>

  </body>
</html>
